spring:
  config:
    activate:
      on-profile: postgres
  autoconfigure:
    exclude: []
  datasource:
    url: ${DATABASE_JDBC_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:shadow_engineer}}
    username: ${DATABASE_USERNAME:${PGUSER:shadow}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD:shadow}}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
