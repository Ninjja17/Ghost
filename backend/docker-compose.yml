services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shadow_engineer
      POSTGRES_USER: shadow
      POSTGRES_PASSWORD: shadow
    ports:
      - "5432:5432"
    volumes:
      - shadow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadow -d shadow_engineer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - shadow-redis-data:/data

volumes:
  shadow-postgres-data:
  shadow-redis-data:
